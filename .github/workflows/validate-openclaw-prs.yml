name: OpenClaw 148721 conflict validation
on:
  push:
    branches: [codex/openclaw148721-validation-20261118]
permissions:
  contents: read
jobs:
  pr148721:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dbd1d0b95f85ba55b34211c8a737165110e2f56f
          fetch-depth: 2
          persist-credentials: false
      - name: Verify candidate
        run: |
          test "$(git rev-parse HEAD)" = dbd1d0b95f85ba55b34211c8a737165110e2f56f
          test "$(git rev-parse HEAD^2)" = f7c6804343843245d8ab6f37a91675ecc257a7b9
          git diff --check HEAD^2 HEAD
      - uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: 'false'
      - uses: ./.github/actions/setup-test-bun
        with:
          cache-mode: off
      - name: Focused regression tests
        env:
          OPENCLAW_VITEST_RUNTIME: bun
        run: node scripts/run-vitest.mjs src/agents/embedded-agent-runner/run/attempt-session.test.ts src/agents/embedded-agent-runner/run/attempt-stream-prepare.test.ts src/agents/embedded-agent-runner/run/message-tool-terminal.test.ts src/infra/outbound/source-reply-mirror.test.ts --maxWorkers=1
      - name: Check formatting
        run: git diff --name-only -z HEAD^2 HEAD -- '*.ts' | xargs -0 pnpm exec oxfmt --check
      - name: Check test budget
        run: node --import ./scripts/tsx.mjs scripts/check-test-lines-ratchet.mts --base f7c6804343843245d8ab6f37a91675ecc257a7b9 --no-merge-base
      - name: Type-aware lint and type check of resolved module
        run: node scripts/run-oxlint.mjs --type-aware --type-check --tsconfig tsconfig.json src/agents/embedded-agent-runner/run/message-tool-terminal.ts
