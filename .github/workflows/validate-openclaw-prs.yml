name: OpenClaw PR repair validation
on:
  push:
    branches: [codex/openclaw-pr-validation-20261110-late]
permissions:
  contents: read
jobs:
  pr163897:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 80b44bc3ff94920b89d81454132123bdb164984d
          fetch-depth: 2
          persist-credentials: false
      - name: Verify candidate
        run: |
          test "$(git rev-parse HEAD)" = 80b44bc3ff94920b89d81454132123bdb164984d
          test "$(git rev-parse HEAD^2)" = eb8c48f33712abcf52583c359750ab3294c4bb1d
      - uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: 'false'
      - name: Check test budget
        run: node --import ./scripts/tsx.mjs scripts/check-test-lines-ratchet.mts --base eb8c48f33712abcf52583c359750ab3294c4bb1d --no-merge-base
