name: OpenClaw 148721 validation
on:
  push:
    branches: [codex/openclaw148721-validation-20261110]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7be4b3f6ad3f5efb46a4918c4d4b7639d954292e
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact source and unchanged test budget
        run: |
          test "$(git rev-parse HEAD)" = 7be4b3f6ad3f5efb46a4918c4d4b7639d954292e
          test "$(git rev-parse HEAD^2)" = ce7788f5a24e5e2d0ef146a5dcea3ef4d0bb0983
          git diff --exit-code HEAD^2 HEAD -- config/test-lines-baseline.txt
          git diff --check HEAD^2 HEAD
      - uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
      - name: Validate the test-line budget
        run: node --import ./scripts/tsx.mjs scripts/check-test-lines-ratchet.mts --base ce7788f5a24e5e2d0ef146a5dcea3ef4d0bb0983 --no-merge-base
      - name: Run the affected suites
        env:
          OPENCLAW_VITEST_RUNTIME: bun
          OPENCLAW_VITEST_FS_MODULE_CACHE_PATH: ${{ runner.temp }}/openclaw148721-vitest
        run: |
          node scripts/run-vitest.mjs             src/agents/embedded-agent-runner/run/attempt-session.test.ts             src/agents/embedded-agent-runner/run/attempt-stream-prepare.test.ts             src/agents/embedded-agent-runner/run/message-tool-terminal.test.ts             src/infra/outbound/source-reply-mirror.test.ts --maxWorkers=1
      - name: Format and targeted type-aware lint
        run: |
          git diff --name-only -z HEAD^2 HEAD | xargs -0 pnpm exec oxfmt --check
          node scripts/run-oxlint.mjs --type-aware --type-check --threads 2             src/agents/embedded-agent-runner/run/attempt-session.test.ts             src/agents/embedded-agent-runner/run/attempt-session-prepare.ts
